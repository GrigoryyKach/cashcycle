[package]
name = "cashcycle"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "A clear tracker of your subscriptions and what they cost"

[[bin]]
name = "Cashcycle"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard", "links"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
libc = "0.2"

[profile.release]
opt-level = 3
strip = true
lto = true
